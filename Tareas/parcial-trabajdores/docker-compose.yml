version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - red-trabajadores

  app:
    build: .
    container_name: node_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/trabajadores
      - PORT=3000
    depends_on:
      - mongodb
    networks:
      - red-trabajadores

volumes:
  mongo_data:

networks:
  red-trabajadores:
    driver: bridge