services:
  nginx:
    image: nginx:alpine
    container_name: proxy_nginx
    ports:
      - "${PORT_NGINX}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/salud-proxy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - red_practica

  api:
    build: ./api
    # IMPORTANTE: No usar container_name para permitir --scale api=3
    # IMPORTANTE: No se publica puerto al host (la entrada es solo Nginx)
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:${MONGO_PORT}/${MONGO_DB}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/salud || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - red_practica

  mongo:
    image: mongo:7
    container_name: mongo_tareas
    volumes:
      - datos_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - red_practica

volumes:
  datos_mongo:

networks:
  red_practica:
    driver: bridge