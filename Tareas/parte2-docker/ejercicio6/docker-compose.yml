services:
  api:
    build: ./api
    container_name: inventario_api
    ports:
      - "${PORT_APP}:3000"
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:${DB_PORT}/${DB_NAME}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - red_inventario
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: inventario_db
    volumes:
      - datos_inventario:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - red_inventario
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2
    container_name: inventario_ui
    ports:
      - "${PORT_EXPRESS}:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - red_inventario
    restart: unless-stopped

volumes:
  datos_inventario:
    name: datos_inventario

networks:
  red_inventario:
    driver: bridge