global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: tareas-api
    static_configs:
      - targets: ["host.docker.internal:3002"]

  - job_name: notificaciones
    static_configs:
      - targets: ["host.docker.internal:3001"]
