apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tareas
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rchavez-dev/microservicios.git
    targetRevision: main
    path: Tareas/practica9-kubernetes/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
