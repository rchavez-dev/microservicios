---
# Source: ms-votos/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: votos-prod-ms-votos
  labels:
    helm.sh/chart: ms-votos-0.1.0
    app.kubernetes.io/name: ms-votos
    app.kubernetes.io/instance: votos-prod
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: ms-votos
    app.kubernetes.io/instance: votos-prod

  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
---
# Source: ms-votos/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: votos-prod-ms-votos
  labels:
    helm.sh/chart: ms-votos-0.1.0
    app.kubernetes.io/name: ms-votos
    app.kubernetes.io/instance: votos-prod
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: ms-votos
      app.kubernetes.io/instance: votos-prod

  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-votos
        app.kubernetes.io/instance: votos-prod

    spec:
      containers:
        - name: ms-votos
          image: "ghcr.io/rchavez-dev/ms-votos:1.3.0"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: NODE_ENV
              value: "production"

            - name: DEP_HOST
              value: "votos-dependencia"

            - name: DEP_PORT
              value: "80"

          readinessProbe:
            httpGet:
              path: /salud/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /salud/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
# Source: ms-votos/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: votos-prod-ms-votos
  labels:
    helm.sh/chart: ms-votos-0.1.0
    app.kubernetes.io/name: ms-votos
    app.kubernetes.io/instance: votos-prod
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm

spec:
  ingressClassName: traefik

  rules:
    - host: votos-prod.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: votos-prod-ms-votos
                port:
                  number: 80
