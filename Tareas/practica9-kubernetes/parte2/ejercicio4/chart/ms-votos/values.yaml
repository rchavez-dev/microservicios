replicaCount: 2

image:
  repository: ghcr.io/rchavez-dev/ms-votos
  tag: "1.3.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: traefik
  host: votos.localhost

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  PORT: "3000"
  NODE_ENV: "production"
  DEP_HOST: "votos-dependencia"
  DEP_PORT: "80"

probes:
  readiness:
    path: /salud/ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

  liveness:
    path: /salud/live
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

strategy:
  maxSurge: 1
  maxUnavailable: 0
