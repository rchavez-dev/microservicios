apiVersion: v1
kind: Service
metadata:
  name: {{ include "ms-votos.fullname" . }}
  labels:
    {{- include "ms-votos.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "ms-votos.selectorLabels" . | nindent 4 }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
