apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ms-votos.fullname" . }}
  labels:
    {{- include "ms-votos.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}

  selector:
    matchLabels:
      {{- include "ms-votos.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "ms-votos.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: ms-votos
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.targetPort }}

          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}

            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}

            - name: DEP_HOST
              value: {{ .Values.env.DEP_HOST | quote }}

            - name: DEP_PORT
              value: {{ .Values.env.DEP_PORT | quote }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
