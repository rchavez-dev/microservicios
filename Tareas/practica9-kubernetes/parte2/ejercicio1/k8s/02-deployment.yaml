apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-votos
  namespace: votos-ej1

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: ms-votos

  template:
    metadata:
      labels:
        app: ms-votos

    spec:
      containers:
        - name: ms-votos
          image: ghcr.io/rchavez-dev/ms-votos:1.3.0

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: ms-votos-config

          env:
            - name: DEP_HOST
              value: "votos-dependencia"

            - name: DEP_PORT
              value: "80"

          livenessProbe:
            httpGet:
              path: /salud/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"
