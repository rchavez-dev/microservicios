apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-votos
  namespace: votos-ej1
spec:
  ingressClassName: traefik
  rules:
    - host: votos.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ms-votos
                port:
                  number: 80
