apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ms-votos-gitops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rchavez-dev/microservicios.git
    targetRevision: main
    path: Tareas/practica9-kubernetes/parte2/ejercicio4/chart/ms-votos

    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: votos-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
